services:
  blue-app:
    build: .
    container_name: blue-app
    environment:
      - APP_VERSION=blue-v1
    expose:
      - "3000"

  green-app:
    build: .
    container_name: green-app
    environment:
      - APP_VERSION=green-v1
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - blue-app
      - green-app