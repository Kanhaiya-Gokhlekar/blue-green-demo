name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/blue-green-demo

            ACTIVE=$(grep "proxy_pass" nginx/default.conf | grep -o 'blue-app\|green-app')

            if [ "$ACTIVE" = "blue-app" ]; then
              NEW="green-app"
              VERSION="green-v2"
            else
              NEW="blue-app"
              VERSION="blue-v2"
            fi

            docker pull kanhaiya05/blue-green-demo:latest

            docker rm -f $NEW || true

            docker run -d \
              --name $NEW \
              --network blue-green-demo_default \
              -e APP_VERSION=$VERSION \
              kanhaiya05/blue-green-demo:latest

            sleep 10

            docker exec nginx-proxy sh -c "sed -i 's|proxy_pass http://.*:3000;|proxy_pass http://$NEW:3000;|' /etc/nginx/conf.d/default.conf"

            docker exec nginx-proxy nginx -s reload

            echo "Traffic switched to $NEW"